name: Build SHARDA BOUTIQUE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run
       unzip -o SHARDA_BOUTIQUE_ANDROID_PROJECT_JVM17_PHOTO_FIXED_UPDATE_READY.zip
          cp -r androidproj/. .
          rm -rf androidproj
          chmod +x gradlew 2>/dev/null || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with: 
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHARDA-BOUTIQUE-APK
          path: app/build/outputs/apk/debug/*.apk
